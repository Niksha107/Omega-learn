
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice AJAX CRUD - Omega Learn</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body { font-family: Arial, sans-serif; padding: 25px; }
        .container { max-width: 1100px; margin: auto; }
        form { max-width: 550px; margin-bottom: 25px; }
        input, select, textarea {
            display: block;
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
        }
        button, .back {
            padding: 9px 14px;
            border: 0;
            border-radius: 5px;
            background: #18233f;
            color: white;
            cursor: pointer;
            text-decoration: none;
            margin: 3px;
        }
        .delete { background: #b42318; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #18233f; color: white; }
        #message { margin: 15px 0; }
        .success { color: green; }
        .error { color: #b42318; }
        .loading { color: #555; }
        @media (max-width: 700px) {
            .table-wrap { overflow-x: auto; }
            table { min-width: 650px; }
        }
    </style>
</head>
<body>
<div class="container">

    <h1>Notice Management - AJAX CRUD</h1>
    <p>Add, view, edit, and delete notices without refreshing the page.</p>

    <p id="message" role="status" aria-live="polite"></p>
    <p id="loading" class="loading">Loading notices...</p>

    <h2 id="formTitle">Add Notice</h2>

    <form id="noticeForm">
        <input type="hidden" id="noticeId">

        <label for="title">Title</label>
        <input type="text" id="title" maxlength="150" required>

        <label for="category">Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Notes</option>
            <option>Course</option>
            <option>Project</option>
            <option>Exam</option>
            <option>Event</option>
            <option>General</option>
            <option>Study</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="description">Description</label>
        <textarea id="description" rows="4" required></textarea>

        <button type="submit" id="saveButton">Add Notice</button>
        <button type="button" id="cancelButton" hidden>Cancel Edit</button>
    </form>

    <h2>All Notices</h2>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="noticeList"></tbody>
        </table>
    </div>

    <p><a class="back" href="admin.php">Back to Admin Dashboard</a></p>
</div>

<script>
const api = "notice_api.php";

const form = document.getElementById("noticeForm");
const list = document.getElementById("noticeList");
const message = document.getElementById("message");
const loading = document.getElementById("loading");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");

let busy = false;
let csrfToken = "";

function showMessage(text, type = "success") {
    message.textContent = text;
    message.className = type;
}

async function request(url, options = {}) {
    const headers = new Headers(options.headers || {});
    if (options.method && options.method !== "GET" && csrfToken) {
        headers.set("X-CSRF-Token", csrfToken);
    }

    const response = await fetch(url, { ...options, headers });
    const data = await response.json();

    if (!response.ok || !data.success) {
        throw new Error(data.message || "Request failed.");
    }

    if (data.csrfToken) {
        csrfToken = data.csrfToken;
    }

    return data;
}

function addCell(row, value) {
    const cell = document.createElement("td");
    cell.textContent = value ?? "";
    row.appendChild(cell);
}

function resetForm() {
    form.reset();
    document.getElementById("noticeId").value = "";
    document.getElementById("formTitle").textContent = "Add Notice";
    saveButton.textContent = "Add Notice";
    cancelButton.hidden = true;
}

async function loadNotices() {
    loading.hidden = false;
    loading.textContent = "Loading notices...";
    list.replaceChildren();

    try {
        const result = await request(api);
        if (!csrfToken) {
            showMessage("Log in as an administrator to manage notices.", "error");
            document.querySelector("thead th:last-child").hidden = true;
            form.hidden = true;
            document.getElementById("formTitle").hidden = true;
        }
        const fragment = document.createDocumentFragment();

        result.data.forEach(notice => {
            const row = document.createElement("tr");

            addCell(row, notice.id);
            addCell(row, notice.title);
            addCell(row, notice.category);
            addCell(row, notice.date);
            addCell(row, notice.description);

            if (csrfToken) {
                const actions = document.createElement("td");

                const edit = document.createElement("button");
                edit.textContent = "Edit";
                edit.type = "button";
                edit.addEventListener("click", () => editNotice(notice));

                const del = document.createElement("button");
                del.textContent = "Delete";
                del.type = "button";
                del.className = "delete";
                del.addEventListener("click", () => deleteNotice(notice.id));

                actions.append(edit, del);
                row.appendChild(actions);
            }

            fragment.appendChild(row);
        });

        list.appendChild(fragment);
        loading.hidden = true;

        if (result.data.length === 0) {
            loading.hidden = false;
            loading.textContent = "No notices found.";
        }
    } catch (error) {
        loading.hidden = false;
        loading.textContent = "Could not load notices.";
        showMessage(error.message, "error");
    }
}

function editNotice(notice) {
    document.getElementById("noticeId").value = notice.id;
    document.getElementById("title").value = notice.title;
    document.getElementById("category").value = notice.category;
    document.getElementById("date").value = notice.date;
    document.getElementById("description").value = notice.description;

    document.getElementById("formTitle").textContent = "Edit Notice";
    saveButton.textContent = "Update Notice";
    cancelButton.hidden = false;
    form.scrollIntoView({ behavior: "smooth" });
}

form.addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;

    const id = document.getElementById("noticeId").value;

    const payload = {
        title: document.getElementById("title").value.trim(),
        category: document.getElementById("category").value,
        date: document.getElementById("date").value,
        description: document.getElementById("description").value.trim()
    };

    if (!payload.title || !payload.category ||
        !payload.date || !payload.description) {
        showMessage("Please fill in all fields.", "error");
        return;
    }

    if (!Number.isFinite(Date.parse(payload.date)) ||
        !/^\d{4}-\d{2}-\d{2}$/.test(payload.date)) {
        showMessage("Please enter a valid date.", "error");
        return;
    }

    if (id) payload.id = Number(id);

    busy = true;
    saveButton.disabled = true;
    showMessage(id ? "Updating notice..." : "Adding notice...", "loading");

    try {
        const result = await request(api, {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        resetForm();
        await loadNotices();
        showMessage(result.message);
    } catch (error) {
        showMessage(error.message, "error");
    } finally {
        busy = false;
        saveButton.disabled = false;
    }
});

async function deleteNotice(id) {
    if (busy) return;

    if (!confirm("Are you sure you want to delete this notice?")) return;

    busy = true;
    showMessage("Deleting notice...", "loading");

    try {
        const result = await request(api, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id })
        });

        if (document.getElementById("noticeId").value === String(id)) {
            resetForm();
        }

        await loadNotices();
        showMessage(result.message);
    } catch (error) {
        showMessage(error.message, "error");
    } finally {
        busy = false;
    }
}

cancelButton.addEventListener("click", resetForm);

loadNotices();
</script>
</body>
</html>
