<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="signup-page">
            <div class="signup-box">

                <div class="Logo">
                    <div class="Logo-symbol">Ω</div>
                    <div class="Logo-text">
                        <span>OMEGA</span><br>
                        <span>LEARN</span>
                    </div>
                </div>


                <h2>Create Your Account</h2>
                <p>Start your learning journey with Omega Learn.</p>

                <form id="signupForm" action="register.php" method="POST">


                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                    <small class="error" id="nameError"></small>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                    <small class="error" id="emailError"></small>

                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    <small class="error" id="usernameError"></small>


                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                    <small class="error" id="phoneError"></small>

                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Enter your address">
                    <small class="error" id="addressError"></small>

                    <label for="city">City</label>
                    <select id="city" name="city">
                        <option value="">Select your city</option>
                        <option value="Surat">Surat</option>
                        <option value="Pune">Pune</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Ahmedabad">Ahmedabad</option>
                        <option value="Jaipur">Jaipur</option>
                        <option value="Lucknow">Lucknow</option>
                        <option value="Kolkata">Kolkata</option>
                    </select>
                    <small class="error" id="cityError"></small>

                    <label for="state">State</label>
                    <select id="state" name="state">
                        <option value="">Select your state</option>
                        <option value="Maharashtra">Maharashtra</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Gujarat">Gujarat</option>
                        <option value="Rajasthan">Rajasthan</option>
                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                        <option value="West Bengal">West Bengal</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                    </select>
                    <small class="error" id="stateError"></small>

                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode">
                    <small class="error" id="pincodeError"></small>

                    <label for="course">Course</label>
                    <select id="course" name="course">
                        <option value="">Select a course</option>
                        <option value="C Programming">C Programming</option>
                        <option value="C++ Programming">C++ Programming</option>
                        <option value="Data Structures & Algorithms">Data Structures & Algorithms</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Python">Python</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                    </select>
                    <small class="error" id="courseError"></small>

                    <label for="year">Year</label>
                    <select id="year" name="year">
                        <option value="">Select your year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                    <small class="error" id="yearError"></small>

                    <label>Gender</label>
                    <div class="gender">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <small class="error" id="genderError"></small>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password">
                    <small class="strength" id="strength"></small>
                    <small class="error" id="passwordError"></small>

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm your password">
                    <small class="error" id="confirmPasswordError"></small>

                    <label class="check">
                        <input type="checkbox" id="terms" name="terms">
                        I agree to the Terms & Conditions and Privacy Policy
                    </label>
                    <small class="error" id="termsError"></small>

                    <button type="submit" class="form-btn">
                        Create Account
                    </button>
                    <small class="success" id="successMessage"></small>
                </form>

                <div class="or">
                    <span>OR</span>
                </div>

                <a href="#" class="google">Continue with Google</a>

                <p class="account">
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>

            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.has("error")) {
            alert(params.get("error"));
        }

        if (params.has("success")) {
            alert(params.get("success"));
        }
    </script>
</body>

</html>
